# Podman Compose Configuration

version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: Containerfile
    container_name: observability-bridge
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://admin:admin123@db:5432/observability?sslmode=disable
      - LOG_LEVEL=info
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - observability-network

  db:
    image: postgres:15-alpine
    container_name: observability-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DB=observability
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    networks:
      - observability-network

volumes:
  postgres-data:

networks:
  observability-network:
    driver: bridge
