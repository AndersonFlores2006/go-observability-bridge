<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Observability Bridge</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #080c14;
  --surface: rgba(16, 24, 48, 0.65);
  --surface-hover: rgba(20, 30, 60, 0.8);
  --border: rgba(45, 212, 191, 0.08);
  --border-hover: rgba(45, 212, 191, 0.2);
  --text: #f1f5f9;
  --dim: #64748b;
  --accent: #2dd4bf;
  --accent-dim: rgba(45, 212, 191, 0.12);
  --amber: #f59e0b;
  --amber-dim: rgba(245, 158, 11, 0.12);
  --red: #ef4444;
  --red-dim: rgba(239, 68, 68, 0.12);
  --green: #22c55e;
  --font: 'Plus Jakarta Sans', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --radius: 14px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 15px; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── Background ─── */
.bg {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.bg-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(45, 212, 191, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(45, 212, 191, 0.03) 1px, transparent 1px);
  background-size: 48px 48px;
}
.bg-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.3;
  animation: orb 20s ease-in-out infinite alternate;
}
.bg-orb:nth-child(2) { width: 60vmax; height: 60vmax; top: -20%; left: -20%; background: radial-gradient(circle, rgba(45, 212, 191, 0.08), transparent); }
.bg-orb:nth-child(3) { width: 50vmax; height: 50vmax; bottom: -30%; right: -15%; background: radial-gradient(circle, rgba(245, 158, 11, 0.06), transparent); animation-delay: -7s; }

@keyframes orb {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(6%, 8%) scale(1.15); }
}

/* ─── Noise ─── */
.bg-noise {
  position: absolute; inset: 0;
  opacity: 0.015;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ─── Layout ─── */
.app {
  position: relative; z-index: 1;
  max-width: 1320px; margin: 0 auto; padding: 20px 28px 48px;
}

/* ─── Header ─── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 32px;
  padding: 16px 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  animation: inDown .6s ease-out;
}

@keyframes inDown {
  from { opacity: 0; transform: translateY(-16px); }
  to { opacity: 1; transform: translateY(0); }
}

.brand {
  display: flex; align-items: center; gap: 14px;
}
.brand-mark {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, #2dd4bf, #0d9488);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: #080c14; font-weight: 800;
  box-shadow: 0 0 20px rgba(45, 212, 191, 0.25);
}
.brand h1 {
  font-size: 20px; font-weight: 800; letter-spacing: -0.4px;
}

.pulse {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 500; color: var(--dim);
}
.pulse-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--red);
  transition: background .4s, box-shadow .4s;
}
.pulse-dot.on {
  background: var(--green);
  box-shadow: 0 0 10px var(--green);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .4; }
}

/* ─── Grids ─── */
.grid {
  display: grid; gap: 20px; margin-bottom: 20px;
}
.grid-3 { grid-template-columns: 1.1fr 1.4fr 1fr; }
.grid-2 { grid-template-columns: 1fr 1fr; }

/* ─── Cards ─── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  transition: border-color .3s, transform .3s;
  animation: inUp .6s ease-out backwards;
}
.card:hover { border-color: var(--border-hover); }
.card:nth-child(1) { animation-delay: .1s; }
.card:nth-child(2) { animation-delay: .2s; }
.card:nth-child(3) { animation-delay: .3s; }

@keyframes inUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.card-h {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
}
.card-h h2 {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1.4px; color: var(--dim);
}
.card-h .pill {
  font-size: 10px; font-weight: 600; font-family: var(--mono);
  padding: 3px 12px; border-radius: 20px;
  background: var(--accent-dim); color: var(--accent);
}

/* ─── Stat quads ─── */
.quad {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.cell {
  background: rgba(0,0,0,.25);
  border-radius: 10px; padding: 14px 12px; text-align: center;
}
.cell-v {
  font-size: 22px; font-weight: 800; font-family: var(--mono);
  letter-spacing: -.5px;
  color: var(--accent);
}
.cell-l {
  font-size: 9px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1px; color: var(--dim); margin-top: 3px;
}

/* ─── Chart ─── */
.chart-box {
  position: relative;
}
.chart-box canvas {
  width: 100%; height: 200px;
  border-radius: 8px;
  display: block;
}
.chart-tip {
  position: absolute;
  pointer-events: none;
  background: rgba(8,12,20,.92);
  border: 1px solid rgba(45,212,191,.2);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12px;
  font-family: var(--mono);
  white-space: nowrap;
  opacity: 0;
  transition: opacity .15s;
  z-index: 5;
  transform: translate(-50%, -100%);
}
.chart-tip.show { opacity: 1; }
.chart-tip .tip-v { color: var(--accent); font-weight: 600; }
.chart-tip .tip-t { color: var(--dim); font-size: 10px; }

.chart-bar {
  display: flex; gap: 8px; margin-top: 14px;
}
.chart-bar input {
  flex: 1;
  background: rgba(0,0,0,.35);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 8px;
  padding: 9px 14px;
  font-family: var(--mono); font-size: 13px;
  color: var(--text);
  transition: border-color .2s;
}
.chart-bar input:focus {
  outline: none; border-color: var(--accent);
}
.chart-bar input::placeholder { color: var(--dim); }

/* ─── Buttons ─── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 20px;
  border: none; border-radius: 8px;
  font-family: var(--font); font-size: 13px; font-weight: 600;
  cursor: pointer; color: #fff;
  background: linear-gradient(135deg, #2dd4bf, #0d9488);
  box-shadow: 0 4px 14px rgba(45, 212, 191, .2);
  transition: all .25s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(45, 212, 191, .3); }
.btn:active { transform: translateY(0); }

/* ─── Forms ─── */
.form-s {
  display: grid; gap: 10px;
}
.form-r {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}

input, select, textarea {
  background: rgba(0,0,0,.35);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 8px;
  padding: 10px 14px;
  font-family: var(--font); font-size: 13px;
  color: var(--text); width: 100%;
  transition: border-color .2s;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent);
}
textarea { resize: vertical; min-height: 54px; }
select option { background: #0f172a; }

/* ─── Logs ─── */
.logs-box {
  max-height: 280px; overflow-y: auto;
}
.logs-box::-webkit-scrollbar { width: 3px; }
.logs-box::-webkit-scrollbar-track { background: transparent; }
.logs-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 2px; }

.log-item {
  display: flex; gap: 10px;
  padding: 12px 14px;
  background: rgba(0,0,0,.2);
  border-radius: 8px; margin-bottom: 6px;
  font-size: 13px;
  border-left: 3px solid var(--dim);
  animation: logIn .25s ease-out;
}
@keyframes logIn {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}

.log-item.ERROR { border-left-color: var(--red); }
.log-item.WARN  { border-left-color: var(--amber); }
.log-item.INFO  { border-left-color: var(--accent); }
.log-item.DEBUG { border-left-color: var(--dim); }

.log-tag {
  font-size: 9px; font-weight: 700; font-family: var(--mono);
  padding: 2px 7px; border-radius: 4px;
  white-space: nowrap; height: fit-content;
}
.log-tag.ERROR { background: var(--red-dim); color: var(--red); }
.log-tag.WARN  { background: var(--amber-dim); color: var(--amber); }
.log-tag.INFO  { background: var(--accent-dim); color: var(--accent); }
.log-tag.DEBUG { background: rgba(100,116,139,.15); color: var(--dim); }

.log-body { flex: 1; min-width: 0; }
.log-msg { font-weight: 500; line-height: 1.5; }
.log-meta { font-size: 11px; color: var(--dim); margin-top: 2px; font-family: var(--mono); }
.log-time { font-size: 10px; font-family: var(--mono); color: var(--dim); white-space: nowrap; }

/* ─── Toast ─── */
.toast {
  position: fixed; top: 20px; right: 20px; z-index: 999;
  padding: 12px 22px; border-radius: 10px;
  font-size: 13px; font-weight: 600;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid;
  transform: translateX(120%);
  transition: transform .4s cubic-bezier(.34,1.56,.64,1);
}
.toast.show { transform: translateX(0); }
.toast.ok { background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.25); color: var(--green); }
.toast.err { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.25); color: var(--red); }

/* ─── Empty ─── */
.empty-s {
  text-align: center; padding: 36px 16px; color: var(--dim);
}
.empty-s span { font-size: 28px; opacity: .25; display: block; margin-bottom: 8px; }
.empty-s p { font-size: 13px; }

/* ─── Responsive ─── */
@media (max-width: 860px) {
  .grid-3 { grid-template-columns: 1fr; }
  .grid-2 { grid-template-columns: 1fr; }
  .form-r { grid-template-columns: 1fr; }
  .header { flex-direction: column; gap: 12px; align-items: start; }
  .app { padding: 12px 16px 32px; }
}
</style>
</head>
<body>

<div class="bg">
  <div class="bg-grid"></div>
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
  <div class="bg-noise"></div>
</div>

<div class="app">
  <header class="header">
    <div class="brand">
      <div class="brand-mark">&#9670;</div>
      <h1>Observability Bridge</h1>
    </div>
    <div class="pulse">
      <span class="pulse-dot" id="healthDot"></span>
      <span id="healthLabel">Conectando...</span>
    </div>
  </header>

  <div class="grid grid-3">
    <div class="card">
      <div class="card-h">
        <h2>Estado</h2>
        <span class="pill" id="verPill">1.0.0</span>
      </div>
      <div class="quad">
        <div class="cell"><div class="cell-v" id="cStatus">-</div><div class="cell-l">Status</div></div>
        <div class="cell"><div class="cell-v" id="cUptime">-</div><div class="cell-l">Uptime</div></div>
        <div class="cell"><div class="cell-v" id="cVersion">-</div><div class="cell-l">Versi&oacute;n</div></div>
        <div class="cell"><div class="cell-v" id="cMetrics">0</div><div class="cell-l">Puntos</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-h">
        <h2>M&eacute;tricas</h2>
        <span class="pill" id="tickPill">15s</span>
      </div>
      <div class="chart-box">
        <canvas id="chart"></canvas>
        <div class="chart-tip" id="chartTip"><span class="tip-v"></span><br><span class="tip-t"></span></div>
      </div>
      <div class="chart-bar">
        <input type="text" id="metricInput" value="cpu_usage" placeholder="cpu_usage">
        <button class="btn" onclick="loadMetric()">Cargar</button>
      </div>
    </div>

    <div class="card">
      <div class="card-h">
        <h2>Logs</h2>
        <span class="pill" id="logPill">0</span>
      </div>
      <div class="logs-box" id="logsList">
        <div class="empty-s"><span>&#9776;</span><p>Esperando logs...</p></div>
      </div>
    </div>
  </div>

  <div class="grid grid-2">
    <div class="card">
      <div class="card-h"><h2>Enviar M&eacute;trica</h2></div>
      <form class="form-s" onsubmit="sendMetric(event)">
        <div class="form-r">
          <input type="text" id="mName" placeholder="Nombre (ej: cpu_usage)" required>
          <input type="number" id="mValue" placeholder="Valor" step="any" required>
        </div>
        <div class="form-r">
          <input type="text" id="mHost" placeholder="Host (opcional)">
          <input type="text" id="mRegion" placeholder="Regi&oacute;n (opcional)">
        </div>
        <button class="btn" type="submit">Enviar M&eacute;trica</button>
      </form>
    </div>

    <div class="card">
      <div class="card-h"><h2>Enviar Log</h2></div>
      <form class="form-s" onsubmit="sendLog(event)">
        <div class="form-r">
          <select id="lLevel" required>
            <option value="">Nivel</option>
            <option value="DEBUG">DEBUG</option>
            <option value="INFO">INFO</option>
            <option value="WARN">WARN</option>
            <option value="ERROR">ERROR</option>
          </select>
          <input type="text" id="lService" placeholder="Servicio" required>
        </div>
        <textarea id="lMessage" placeholder="Mensaje" rows="2" required></textarea>
        <button class="btn" type="submit">Enviar Log</button>
      </form>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api/v1';
let logN = 0;

const $ = id => document.getElementById(id);

function toast(text, ok) {
  const t = $('toast');
  t.textContent = text;
  t.className = 'toast ' + (ok ? 'ok' : 'err') + ' show';
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2600);
}

function esc(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

// ─── Health ───
async function checkHealth() {
  try {
    const r = await fetch(API + '/health');
    const d = await r.json();
    $('healthDot').className = 'pulse-dot on';
    $('healthLabel').textContent = 'Healthy \u2014 ' + new Date().toLocaleTimeString();
    $('cStatus').textContent = (d.status || 'OK').toUpperCase();
    $('cVersion').textContent = 'v' + (d.version || '1.0.0');
    $('verPill').textContent = 'v' + (d.version || '1.0.0');
    if (d.timestamp) {
      const sec = Math.floor((Date.now() - new Date(d.timestamp).getTime()) / 1000);
      $('cUptime').textContent = Math.floor(sec / 60) + 'm ' + (sec % 60) + 's';
    }
  } catch {
    $('healthDot').className = 'pulse-dot';
    $('healthLabel').textContent = 'Offline';
    $('cStatus').textContent = 'ERR';
    $('cUptime').textContent = '\u2014';
  }
}

// ─── Chart ───
let chartPoints = [];

function drawChart(data) {
  const canvas = $('chart');
  const ctx = canvas.getContext('2d');
  const par = canvas.parentElement;
  const W = canvas.width = Math.max(par.clientWidth || 300, 100);
  const H = canvas.height = 200;

  chartPoints = [];

  ctx.clearRect(0, 0, W, H);

  if (!data || data.length < 2) {
    ctx.fillStyle = '#64748b';
    ctx.font = '14px Plus Jakarta Sans, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(data && data.length === 1 ? 'Solo 1 punto, env\u00eda m\u00e1s datos' : 'Sin datos', W / 2, H / 2);
    $('cMetrics').textContent = data ? data.length : 0;
    return;
  }

  const vals = data.map(v => v.value);
  const times = data.map(v => {
    const t = new Date(v.timestamp);
    return t.getHours().toString().padStart(2,'0') + ':' + t.getMinutes().toString().padStart(2,'0');
  });

  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const range = max - min || 1;
  const pad = { t: 16, b: 24, l: 50, r: 16 };
  const cw = W - pad.l - pad.r;
  const ch = H - pad.t - pad.b;

  const xi = i => pad.l + (i / (data.length - 1)) * cw;
  const yi = v => pad.t + ch - ((v - min) / range) * ch;

  // grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const yp = pad.t + (i / 4) * ch;
    ctx.beginPath(); ctx.moveTo(pad.l, yp); ctx.lineTo(W - pad.r, yp); ctx.stroke();
  }

  // area fill
  ctx.beginPath();
  ctx.moveTo(xi(0), yi(vals[0]));
  for (let i = 1; i < data.length; i++) ctx.lineTo(xi(i), yi(vals[i]));
  ctx.lineTo(xi(data.length - 1), pad.t + ch);
  ctx.lineTo(xi(0), pad.t + ch);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + ch);
  grad.addColorStop(0, 'rgba(45,212,191,0.15)');
  grad.addColorStop(1, 'rgba(45,212,191,0)');
  ctx.fillStyle = grad;
  ctx.fill();

  // line
  ctx.beginPath();
  for (let i = 0; i < data.length; i++) {
    i === 0 ? ctx.moveTo(xi(i), yi(vals[i])) : ctx.lineTo(xi(i), yi(vals[i]));
  }
  ctx.strokeStyle = '#2dd4bf';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // glow line
  ctx.beginPath();
  for (let i = 0; i < data.length; i++) {
    i === 0 ? ctx.moveTo(xi(i), yi(vals[i])) : ctx.lineTo(xi(i), yi(vals[i]));
  }
  ctx.strokeStyle = 'rgba(45,212,191,0.2)';
  ctx.lineWidth = 6;
  ctx.stroke();

  // store points for tooltip
  chartPoints = data.map((d, i) => ({
    x: xi(i), y: yi(vals[i]), v: vals[i], t: d.timestamp
  }));

  // points
  for (let i = 0; i < data.length; i++) {
    ctx.beginPath();
    ctx.arc(chartPoints[i].x, chartPoints[i].y, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#2dd4bf';
    ctx.fill();
    ctx.strokeStyle = '#080c14';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // y labels
  ctx.fillStyle = '#64748b';
  ctx.font = '10px JetBrains Mono, monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const val = min + (range * i / 4);
    const yp = pad.t + ch - (i / 4) * ch;
    ctx.fillText(val.toFixed(1), pad.l - 8, yp);
  }

  // x labels
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const step = Math.max(1, Math.floor(data.length / 10));
  for (let i = 0; i < data.length; i += step) {
    ctx.fillText(times[i], xi(i), pad.t + ch + 6);
  }

  $('cMetrics').textContent = data.length;
}

async function loadMetric() {
  const name = $('metricInput').value || 'cpu_usage';
  try {
    const r = await fetch(API + '/metrics/query?metric=' + encodeURIComponent(name));
    if (!r.ok) { drawChart([]); return; }
    const d = await r.json();
    drawChart(d.values || []);
  } catch { drawChart([]); }
}

// ─── Chart hover ───
const tip = $('chartTip');
$('chart').addEventListener('mousemove', function(e) {
  const rect = this.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let near = null, minDist = 20;
  for (const p of chartPoints) {
    const d = Math.hypot(mx - p.x, my - p.y);
    if (d < minDist) { minDist = d; near = p; }
  }
  if (near) {
    const t = new Date(near.t);
    tip.querySelector('.tip-v').textContent = near.v.toFixed(2);
    tip.querySelector('.tip-t').textContent = t.toLocaleString();
    tip.style.left = near.x + 'px';
    tip.style.top = (near.y - 12) + 'px';
    tip.classList.add('show');
  } else {
    tip.classList.remove('show');
  }
});
$('chart').addEventListener('mouseleave', () => tip.classList.remove('show'));

// ─── Send Metric ───
async function sendMetric(e) {
  e.preventDefault();
  const p = { name: $('mName').value, value: parseFloat($('mValue').value), labels: {} };
  const h = $('mHost').value, r = $('mRegion').value;
  if (h) p.labels.host = h;
  if (r) p.labels.region = r;
  try {
    const res = await fetch(API + '/metrics', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p) });
    if (res.ok) { toast('M\u00e9trica enviada', true); e.target.reset(); loadMetric(); }
    else toast((await res.json()).error || 'Error', false);
  } catch { toast('Error de conexi\u00f3n', false); }
}

// ─── Send Log ───
async function sendLog(e) {
  e.preventDefault();
  const p = { level: $('lLevel').value, service: $('lService').value, message: $('lMessage').value };
  try {
    const res = await fetch(API + '/logs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p) });
    if (res.ok) { toast('Log enviado', true); e.target.reset(); addLog(p); }
    else toast((await res.json()).error || 'Error', false);
  } catch { toast('Error de conexi\u00f3n', false); }
}

function addLog(l) {
  const list = $('logsList');
  const empty = list.querySelector('.empty-s');
  if (empty) list.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'log-item ' + l.level;
  el.innerHTML = '<span class="log-tag ' + l.level + '">' + l.level + '</span><div class="log-body"><div class="log-msg">' + esc(l.message) + '</div><div class="log-meta">' + esc(l.service || '') + '</div></div><span class="log-time">' + new Date().toLocaleTimeString() + '</span>';
  list.insertBefore(el, list.firstChild);
  while (list.children.length > 50) list.removeChild(list.lastChild);
  $('logPill').textContent = ++logN;
}

// ─── Load logs from API ───
async function loadLogs() {
  try {
    const r = await fetch(API + '/logs');
    if (!r.ok) return;
    const logs = await r.json();
    if (!logs || !logs.length) return;
    const list = $('logsList');
    const empty = list.querySelector('.empty-s');
    if (empty) list.innerHTML = '';
    logs.reverse();
    for (const l of logs) {
      const el = document.createElement('div');
      el.className = 'log-item ' + l.level;
      el.innerHTML = '<span class="log-tag ' + l.level + '">' + l.level + '</span><div class="log-body"><div class="log-msg">' + esc(l.message) + '</div><div class="log-meta">' + esc(l.service || '') + '</div></div><span class="log-time">' + new Date(l.timestamp).toLocaleTimeString() + '</span>';
      list.appendChild(el);
    }
    logN = logs.length;
    $('logPill').textContent = logN;
  } catch {}
}

// ─── Init ───
checkHealth(); setInterval(checkHealth, 15000);
loadMetric(); setInterval(loadMetric, 15000);
loadLogs();
</script>
